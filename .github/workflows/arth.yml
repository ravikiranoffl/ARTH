name: ARTH Matrix

on:
  schedule:
    # Changed to 06:41 and 17:41 UTC (12:11 PM and 11:11 PM IST)
    # Using specific prime-number offsets completely avoids global automation bottlenecks
    - cron: '41 6,17 * * *' 
  workflow_dispatch:

jobs:
  build-and-archive:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute ARTH Extraction Engine
        run: python main.py

      - name: Commit and Push Verified Contribution
        run: |
          # Configure commit profile to explicitly log under your authenticated profile
          git config --local user.email "171322216+ravikiranoffl@users.noreply.github.com"
          git config --local user.name "ravikiranoffl"
          
          # Calculate strict IST timestamp (UTC + 5.5 hours) for the commit message
          IST_TIMESTAMP=$(python -c "from datetime import datetime, timezone, timedelta; print(datetime.now(timezone(timedelta(hours=5, minutes=30))).strftime('%Y%m%dd%H%M%S'))")
          
          git add .
          
          # Clean, readable conditional syntax block replacing the broken subshell logic
          if ! git diff --cached --quiet; then
            git commit -m "$IST_TIMESTAMP"
            git push "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:main
            echo "[SYS] ARTH updates successfully committed and pushed to main."
          else
            echo "[SYS] Baseline clean. No data changes detected in ARTH endpoints today."
          fi
