name: ARTH Matrix

on:
  schedule:
    - cron: '25 6,17 * * *' 
  workflow_dispatch:

jobs:
  build-and-archive:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute ARTH Extraction Engine
        run: python main.py

      - name: Commit and Push Verified Contribution
        run: |
          # Calculate strict IST timestamp (UTC + 5.5 hours) for the commit message
          IST_TIMESTAMP=$(date -u -d "+5 hours 30 minutes" +"%Y%m%d%H%M%S")
          
          git config --local user.email "171322216+ravikiranoffl@users.noreply.github.com"
          git config --local user.name "ravikiranoffl"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "$IST_TIMESTAMP" && git push)
